[package]
name = "ghtuix"
version = "0.1.0"
edition = "2024"
description = "A small, fast terminal UI for GitHub pull requests and local Git"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
graphql_client = "0.16.0"
ratatui = "0.30.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip", "json"] }

[profile.release]
lto = "thin"
strip = true
