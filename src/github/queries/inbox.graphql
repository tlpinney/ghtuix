# The Inbox: open PRs in three queues, one request (aliased searches).
query Inbox($authored: String!, $assigned: String!, $review: String!) {
  authored: search(query: $authored, type: ISSUE, first: 50) {
    nodes {
      __typename
      ... on PullRequest {
        ...Pr
      }
    }
  }
  assigned: search(query: $assigned, type: ISSUE, first: 50) {
    nodes {
      __typename
      ... on PullRequest {
        ...Pr
      }
    }
  }
  review: search(query: $review, type: ISSUE, first: 50) {
    nodes {
      __typename
      ... on PullRequest {
        ...Pr
      }
    }
  }
}

# Recently merged PRs that involve the viewer (the Merged tab, read on demand).
query Merged($query: String!) {
  search(query: $query, type: ISSUE, first: 50) {
    nodes {
      __typename
      ... on PullRequest {
        ...Pr
      }
    }
  }
}

fragment Pr on PullRequest {
  number
  title
  url
  body
  isDraft
  createdAt
  updatedAt
  mergedAt
  repository {
    nameWithOwner
  }
  author {
    __typename
    login
  }
  reviewDecision
  commits(last: 1) {
    nodes {
      commit {
        statusCheckRollup {
          state
        }
      }
    }
  }
  reviewRequests(first: 10) {
    nodes {
      requestedReviewer {
        __typename
        ... on User {
          login
        }
        ... on Bot {
          login
        }
        ... on Mannequin {
          login
        }
        ... on Team {
          combinedSlug
        }
      }
    }
  }
  latestReviews(first: 10) {
    nodes {
      state
      author {
        __typename
        login
      }
    }
  }
  comments(last: 20) {
    nodes {
      author {
        __typename
        login
      }
    }
  }
}
