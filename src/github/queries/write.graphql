# Writes. Each runs only after the user confirms a preview of exactly this effect.
mutation AddComment($subject: ID!, $body: String!) {
  addComment(input: { subjectId: $subject, body: $body }) {
    commentEdge {
      node {
        url
      }
    }
  }
}

mutation AddReview($pr: ID!, $commit: GitObjectID!, $event: PullRequestReviewEvent!, $body: String) {
  addPullRequestReview(input: { pullRequestId: $pr, commitOID: $commit, event: $event, body: $body }) {
    pullRequestReview {
      url
    }
  }
}

mutation AddLineComment(
  $pr: ID!
  $commit: GitObjectID!
  $path: String!
  $line: Int!
  $side: DiffSide!
  $body: String!
) {
  addPullRequestReview(
    input: {
      pullRequestId: $pr
      commitOID: $commit
      event: COMMENT
      threads: [{ path: $path, line: $line, side: $side, body: $body }]
    }
  ) {
    pullRequestReview {
      url
    }
  }
}

# Refused by GitHub when the head is no longer `$head` (someone pushed after the preview).
mutation MergePr($pr: ID!, $method: PullRequestMergeMethod!, $head: GitObjectID!) {
  mergePullRequest(input: { pullRequestId: $pr, mergeMethod: $method, expectedHeadOid: $head }) {
    pullRequest {
      url
      merged
    }
  }
}

mutation ReplyToThread($thread: ID!, $body: String!) {
  addPullRequestReviewThreadReply(input: { pullRequestReviewThreadId: $thread, body: $body }) {
    comment {
      url
    }
  }
}

mutation ResolveThread($thread: ID!) {
  resolveReviewThread(input: { threadId: $thread }) {
    thread {
      isResolved
    }
  }
}

mutation UnresolveThread($thread: ID!) {
  unresolveReviewThread(input: { threadId: $thread }) {
    thread {
      isResolved
    }
  }
}

mutation ClosePr($pr: ID!) {
  closePullRequest(input: { pullRequestId: $pr }) {
    pullRequest {
      url
    }
  }
}

mutation ReopenPr($pr: ID!) {
  reopenPullRequest(input: { pullRequestId: $pr }) {
    pullRequest {
      url
    }
  }
}

mutation ToDraft($pr: ID!) {
  convertPullRequestToDraft(input: { pullRequestId: $pr }) {
    pullRequest {
      url
    }
  }
}

mutation ReadyForReview($pr: ID!) {
  markPullRequestReadyForReview(input: { pullRequestId: $pr }) {
    pullRequest {
      url
    }
  }
}

mutation RenamePr($pr: ID!, $title: String!) {
  updatePullRequest(input: { pullRequestId: $pr, title: $title }) {
    pullRequest {
      url
    }
  }
}

mutation AddLabels($pr: ID!, $labels: [ID!]!) {
  addLabelsToLabelable(input: { labelableId: $pr, labelIds: $labels }) {
    clientMutationId
  }
}

mutation RemoveLabels($pr: ID!, $labels: [ID!]!) {
  removeLabelsFromLabelable(input: { labelableId: $pr, labelIds: $labels }) {
    clientMutationId
  }
}
