# One pull request page: everything the PR view shows except the diff text.
query PrPage($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    mergeCommitAllowed
    squashMergeAllowed
    rebaseMergeAllowed
    pullRequest(number: $number) {
      id
      number
      title
      url
      body
      state
      isDraft
      createdAt
      updatedAt
      mergedAt
      author {
        __typename
        login
      }
      headRefName
      baseRefName
      headRefOid
      baseRefOid
      additions
      deletions
      changedFiles
      mergeable
      mergeStateStatus
      reviewDecision
      labels(first: 50) {
        nodes {
          id
          name
        }
      }
      reviewRequests(first: 30) {
        nodes {
          requestedReviewer {
            __typename
            ... on User {
              login
            }
            ... on Bot {
              login
            }
          }
        }
      }
      comments(first: 100) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...CommentNode
        }
      }
      reviews(first: 50) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ReviewNode
        }
      }
      reviewThreads(first: 50) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ThreadNode
        }
      }
      files(first: 100) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...FileNode
        }
      }
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              state
              contexts(first: 100) {
                nodes {
                  __typename
                  ... on CheckRun {
                    databaseId
                    checkSuite {
                      app {
                        slug
                      }
                    }
                    name
                    status
                    conclusion
                    detailsUrl
                  }
                  ... on StatusContext {
                    context
                    state
                    targetUrl
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

# The next page of each long list of a PR. A list already complete passes its last cursor
# and comes back empty, so one query continues all four at once.
query PrMore(
  $owner: String!
  $name: String!
  $number: Int!
  $comments: String
  $reviews: String
  $threads: String
  $files: String
) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      comments(first: 100, after: $comments) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...CommentNode
        }
      }
      reviews(first: 50, after: $reviews) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ReviewNode
        }
      }
      reviewThreads(first: 50, after: $threads) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ThreadNode
        }
      }
      files(first: 100, after: $files) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...FileNode
        }
      }
    }
  }
}

fragment CommentNode on IssueComment {
  author {
    __typename
    login
  }
  body
  createdAt
}

fragment ReviewNode on PullRequestReview {
  author {
    __typename
    login
  }
  state
  body
  submittedAt
}

fragment ThreadNode on PullRequestReviewThread {
  id
  isResolved
  path
  line
  comments(first: 50) {
    nodes {
      author {
        __typename
        login
      }
      body
      createdAt
    }
  }
}

fragment FileNode on PullRequestChangedFile {
  path
  additions
  deletions
  changeType
}
